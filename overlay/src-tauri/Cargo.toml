[package]
name = "farm-guide-overlay"
version = "1.22.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Flav-Toolkit's feed client, pinned to a commit of its repository (core 0.3.0, PR #10's merge)
flav-sdk = { git = "https://github.com/Flavbestlol/flav-toolkit", rev = "edfb15552710b761024586c8a6aaa78ab8f39a3a" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell"] }
