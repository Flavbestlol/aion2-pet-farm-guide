[package]
name = "farm-guide-overlay"
version = "1.22.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Flav-Toolkit's feed client, pinned to a commit of its repository (core 0.12.0, PR #30's merge: the dock's toggle)
flav-sdk = { git = "https://github.com/Flavbestlol/flav-toolkit", rev = "affd84cbd15f75488baefb2f0c74df6f4f4f03f8" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell"] }
